  <style>
    :root { --ink:#141414; --paper:#fafafa; --muted:#696969; --hair:#d9d9d9; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:Poppins,"Helvetica Neue",Arial,sans-serif; font-size:15px; font-weight:300; line-height:1.5; }

    header { min-height:112px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid var(--hair); }
    .github { justify-self:start; display:grid; place-items:center; width:31px; height:31px; border:1px solid var(--ink); border-radius:50%; transition:.2s; } .github:hover { background:var(--ink); color:white; transform:translateY(-2px); }
    .site-name { text-align:center; font-size:18px; font-weight:600; letter-spacing:-.04em; } nav { justify-self:end; display:flex; gap:28px; font-size:12px; text-transform:uppercase; letter-spacing:.09em; }
    nav a { position:relative; padding:6px 0; } nav a::after { content:""; position:absolute; bottom:0; left:0; width:0; height:1px; background:currentColor; transition:width .2s; } nav a:hover::after,nav .active::after { width:100%; }
    main { min-height:calc(100vh - 177px); display:grid; grid-template-columns:repeat(24,minmax(0,1fr)); align-items:center; padding:0; }
    .copy { grid-column:3 / 14; align-self:center; max-width:440px; } h1 { margin:0 0 16px; font-size:clamp(1.45rem,1.75vw,1.9rem); font-weight:500; letter-spacing:-.035em; line-height:1.28; }
    .copy p { margin:0; max-width:390px; color:var(--ink); font-size:15px; line-height:1.55; } .photo { grid-column:15 / 24; align-self:center; margin:0; background:transparent; } .photo img { display:block; width:100%; height:auto; object-fit:contain; }
    .gallery { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; width:100%; }
    .gallery figure { aspect-ratio:4 / 3; margin:0; overflow:hidden; background:#eee; cursor:zoom-in; } .gallery img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .45s ease; } .gallery figure:hover img { transform:scale(1.025); }
    .lightbox { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:4vw; background:rgb(12 12 12 / .94); opacity:0; pointer-events:none; transition:opacity .2s ease; } .lightbox.is-open { opacity:1; pointer-events:auto; }
    .lightbox img { display:block; max-width:min(92vw,1600px); max-height:88vh; object-fit:contain; box-shadow:0 14px 50px #0009; } .lightbox button { position:absolute; appearance:none; border:0; background:transparent; color:white; cursor:pointer; font:300 2.4rem/1 Arial,sans-serif; }
    .lightbox-close { top:22px; right:28px; } .lightbox-prev { left:20px; } .lightbox-next { right:20px; } .lightbox button:hover { opacity:.7; }
    footer { border-top:1px solid var(--hair); padding:32px 0; color:var(--muted); font-size:11px; letter-spacing:.04em; } footer .shell { display:flex; justify-content:space-between; align-items:center; } .social { display:flex; gap:20px; } .social a:hover { color:var(--ink); }
    @media (max-width:720px) { .shell { width:min(100% - 32px,1920px); } header { min-height:80px; grid-template-columns:1fr auto; } .site-name { grid-column:1; grid-row:1; text-align:left; font-size:16px; } .github { display:none; } nav { grid-column:2; grid-row:1; gap:14px; font-size:10px; } main { display:flex; flex-direction:column; align-items:stretch; gap:34px; min-height:0; padding:54px 0 64px; } .copy { max-width:none; } .photo { margin:0; } .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; } .lightbox { padding:16px; } .lightbox img { max-width:100%; max-height:82vh; } .lightbox-close { top:15px; right:17px; } .lightbox-prev { left:6px; } .lightbox-next { right:6px; } footer .shell { gap:20px; flex-direction:column; } }
  </style>

  <script>
    const galleryImages = [...document.querySelectorAll('.gallery img')];
    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = lightbox.querySelector('img');
    const closeButton = lightbox.querySelector('.lightbox-close');
    let selectedIndex = 0;
    function showImage(index) {
      selectedIndex = (index + galleryImages.length) % galleryImages.length;
      const image = galleryImages[selectedIndex];
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      closeButton.focus();
    }
    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      galleryImages[selectedIndex].closest('figure').focus();
    }
    galleryImages.forEach((image, index) => {
      const item = image.closest('figure');
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', 'Expand ' + image.alt);
      item.addEventListener('click', () => showImage(index));
      item.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showImage(index); } });
    });
    closeButton.addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', () => showImage(selectedIndex - 1));
    lightbox.querySelector('.lightbox-next').addEventListener('click', () => showImage(selectedIndex + 1));
    lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('is-open')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showImage(selectedIndex - 1);
      if (event.key === 'ArrowRight') showImage(selectedIndex + 1);
    });
  </script>
